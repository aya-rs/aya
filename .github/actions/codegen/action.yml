name: Regenerate source bindings
description: Regenerate source bindings with declared Bazel tools and headers

runs:
  using: composite
  steps:
    - name: Generate source bindings
      shell: bash
      run: |
        bazel run //xtask:codegen \
          --config=remote \
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
