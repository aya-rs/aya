name: update Rust nightly

# Component ownership and caller contract: .github/actions/README.md.

on:
  schedule:
    - cron: 00 3 * * *

  workflow_dispatch:

  workflow_call:
    inputs:
      updater-script:
        description: Caller-local nightly updater
        required: true
        type: string
      update-lockfile:
        description: Regenerate the caller's Bazel lockfile
        default: false
        type: boolean

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # This resolves the protected environment in the caller repository.
    environment: nightly-promotion
    env:
      HAS_PROMOTION_TOKEN: ${{ secrets.CRABBY_GITHUB_TOKEN != '' }}
    steps:
      # Checkout resolves the caller; $/ resolves the pinned provider.
      - uses: actions/checkout@v7

      - name: Update the pinned Rust nightly
        id: update
        uses: $/.github/actions/update-nightly
        with:
          updater-script: ${{ inputs.updater-script || 'scripts/update-rust-nightly.py' }}
          update: true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update the Bazel lockfile
        if: >-
          steps.update.outputs.rust-nightly != '' &&
          (inputs.update-lockfile || inputs.updater-script == '')
        run: bazel mod deps --lockfile_mode=update

      - name: Create or update the Rust nightly pull request
        id: pull-request
        if: steps.update.outputs.rust-nightly != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CRABBY_GITHUB_TOKEN || github.token }}
          branch: create-pull-request/rust-nightly
          add-paths: |
            MODULE.bazel
            ${{ (inputs.update-lockfile || inputs.updater-script == '') && 'MODULE.bazel.lock' || '' }}
          commit-message: 'build: update Rust to ${{ steps.update.outputs.rust-nightly }}'
          title: 'build: update Rust to ${{ steps.update.outputs.rust-nightly }}'
          body: Update the pinned Rust nightly and its generated inputs.

      - name: Enable automatic merging when checks pass
        if: >-
          env.HAS_PROMOTION_TOKEN == 'true' &&
          steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.CRABBY_GITHUB_TOKEN }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.pull-request-number }}
          EXPECTED_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          AUTO_MERGE_QUERY: >-
            mutation($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $pullRequestId,
                expectedHeadOid: $expectedHeadOid,
                mergeMethod: SQUASH
              }) {
                pullRequest { autoMergeRequest { enabledAt } }
              }
            }
        run: |
          set -euo pipefail

          pull_request_id=$(gh pr view "$PULL_REQUEST" --json id --jq .id)
          gh api graphql \
            -f query="$AUTO_MERGE_QUERY" \
            -f pullRequestId="$pull_request_id" \
            -f expectedHeadOid="$EXPECTED_HEAD" \
            --jq '.data.enablePullRequestAutoMerge.pullRequest.autoMergeRequest.enabledAt'
