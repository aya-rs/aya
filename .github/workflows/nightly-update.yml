name: Update toolchains and workflow dependencies

on:
  pull_request:
    paths:
      - .github/workflows/actions.lock
      - .github/workflows/nightly-update.yml
      - .github/workflows/rust-toolchains.yml
      - scripts/rust_toolchains.py

  push:
    branches:
      - main

  schedule:
    - cron: 00 3 * * *

  workflow_dispatch:

env:
  # This key is intentionally public so fork pull requests can use BuildBuddy.
  BUILDBUDDY_API_KEY: 5CeVmFS0jDnutd00x9Xl

jobs:
  resolve:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-toolchains.yml
    with:
      channels: >-
        ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        'stable nightly' || 'stable beta nightly' }}

  # Repository-local: regenerate files and publish the update pull request.
  update:
    needs: resolve
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Keep one promotion running and only the newest promotion pending.
    concurrency: nightly-promotion
    # Only main can enter this environment and use its Crabby credential.
    environment: nightly-promotion
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update the pinned Rust toolchains
        env:
          TOOLCHAINS: ${{ needs.resolve.outputs.rust-toolchains }}
        run: python3 -B scripts/rust-toolchain-pins.py update "$TOOLCHAINS"

      # Keep the lockfile synchronized with the native toolchain declarations.
      - name: Update the Bazel lockfile
        run: bazel mod deps --lockfile_mode=update

      - uses: $/.github/actions/codegen

      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ fromJSON(needs.resolve.outputs.rust-toolchains).nightly.rust }}

      - name: Regenerate public API snapshots
        run: cargo xtask public-api --bless

      - name: Refresh locked workflow dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --no-interactive --relock --no-narrow --no-migrate-local-actions

      - name: Create or update the dependency pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          # GitHub requires approval before GITHUB_TOKEN-created PRs run CI.
          # Crabby starts required checks automatically so updates auto-merge.
          # Forks use GITHUB_TOKEN and approve their checks manually.
          token: ${{ secrets.CRABBY_GITHUB_TOKEN || github.token }}
          branch: create-pull-request/rust-nightly
          commit-message: 'build: refresh toolchains and workflow dependencies'
          title: 'build: refresh toolchains and workflow dependencies'
          body: Update Rust stable and nightly pins, regenerate derived files, and refresh locked workflow dependencies when needed.

      - name: Enable auto-merge
        # Forks do not receive the Crabby token required for auto-merge.
        if: >-
          !github.event.repository.fork &&
          steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.CRABBY_GITHUB_TOKEN }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.pull-request-number }}
        run: gh pr merge "$PULL_REQUEST" --auto --rebase
