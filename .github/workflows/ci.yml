name: aya-ci

on:
  push:

  pull_request:

  schedule:
    - cron: 00 4 * * *

env:
  # This key is intentionally public so fork pull requests can use BuildBuddy.
  BUILDBUDDY_API_KEY: 5CeVmFS0jDnutd00x9Xl
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust-toolchains: ${{ steps.toolchains.outputs.rust-toolchains }}
      kernel-lines: ${{ steps.kernels.outputs.kernel-lines }}
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/setup-bazel

      - name: Read the committed Rust toolchains
        id: toolchains
        run: |
          set -euo pipefail

          toolchains=$(python3 -B scripts/rust-toolchain-pins.py current)
          printf 'rust-toolchains=%s\n' "$toolchains" >> "$GITHUB_OUTPUT"

      - name: Read the pinned kernel lines
        id: kernels
        run: |
          set -euo pipefail

          kernel_lines=$(bazel run --lockfile_mode=error @buildifier_prebuilt//:buildozer -- \
            'print name' 'MODULE.bazel:%kernel_source_archive' | \
            jq --raw-input --slurp --compact-output --exit-status \
              'split("\n") | map(select(length > 0) | ltrimstr("aya_kernel_")) | select(length > 0)')
          printf 'kernel-lines=%s\n' "$kernel_lines" >> "$GITHUB_OUTPUT"

  bazel:
    name: bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/setup-bazel

      - name: Check Starlark
        run: bazel run //bazel/format:format.check --lockfile_mode=error

      - name: Test
        run: |
          set -euo pipefail
          # The default JVM heap is under 2 GB on 7 GB macOS runners.
          bazel --host_jvm_args=-Xmx4g test //... \
            --config=remote \
            --lockfile_mode=error \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --remote_downloader_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"

  codegen:
    needs: prepare
    # Ubuntu 26.04 no longer provides the required MIPS libc headers.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: $/.github/actions/codegen
        with:
          toolchain: ${{ fromJSON(needs.prepare.outputs.rust-toolchains).nightly }}
      - name: Check generated files
        id: generated
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            git add --all
            git diff --cached --binary HEAD > "$RUNNER_TEMP/generated.patch"

            {
              printf 'Generated files are out of date. Download and apply the patch:\n\n'
              printf '    gh run download %s --repo %s --name generated-files\n' \
                "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
              printf '    git apply generated.patch\n'
              printf '    rm generated.patch\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload generated files
        if: failure() && steps.generated.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: generated-files
          path: ${{ runner.temp }}/generated.patch
          overwrite: true

  lint:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ fromJSON(needs.prepare.outputs.rust-toolchains).nightly }}
          components: clippy,miri,rustfmt,rust-src

      # Cache usage approaches GitHub's default 10 GB repository allowance.
      # Only save default-branch entries, which every branch and PR can
      # restore, so branch- and PR-scoped entries do not evict shared caches.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,taplo-cli,typos-cli

      # Clippy denies compiler warnings; fetch checks Cargo's manifest warnings.
      - name: Check Cargo manifest warnings
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo +nightly fetch --locked

      - run: git ls-files -- '*.c' '*.h' | xargs clang-format --dry-run --Werror

      - uses: DavidAnson/markdownlint-cli2-action@v24

      - run: taplo fmt --check

      - run: typos

      - run: cargo +nightly fmt --all -- --check

      - name: Install libbpf-rs prerequisites
        run: |
          set -euxo pipefail

          sudo apt update
          sudo apt -y install autopoint

      - run: cargo xtask clippy

      - run: cargo xtask public-api

      - name: Run miri
        run: |
          set -euxo pipefail
          cargo +nightly hack --locked miri test --all-targets --feature-powerset \
            --exclude aya-ebpf \
            --exclude aya-ebpf-bindings \
            --exclude aya-log-ebpf \
            --exclude integration-ebpf \
            --exclude integration-test \
            --workspace

  build-test-aya:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabi
          - loongarch64-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ fromJSON(needs.prepare.outputs.rust-toolchains).stable }}
          targets: ${{ matrix.arch }}

      # Cache usage approaches GitHub's default 10 GB repository allowance.
      # Only save default-branch entries, which every branch and PR can
      # restore, so branch- and PR-scoped entries do not evict shared caches.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      # This is magic, it sets `$CARGO_BUILD_TARGET`.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.arch }}

      - name: Install libbpf-rs prerequisites
        run: |
          set -euxo pipefail

          sudo apt update
          sudo apt -y install autopoint

      - name: Build
        env:
          # Fix for 32-bit ARM: Ubuntu 24.04 GCC defines _TIME_BITS=64 as a built-in,
          # which requires _FILE_OFFSET_BITS=64 (glibc requirement). We must unset
          # _TIME_BITS first because the built-in is seen before -D flags by libbpf-sys.
          CFLAGS_armv7_unknown_linux_gnueabi: "-U_TIME_BITS -D_FILE_OFFSET_BITS=64"
        run: |
          set -euxo pipefail
          cargo hack --locked build --all-targets --feature-powerset \
            --exclude aya-ebpf \
            --exclude aya-ebpf-bindings \
            --exclude aya-log-ebpf \
            --exclude integration-ebpf \
            --exclude xtask \
            --workspace

      - name: Test
        env:
          RUST_BACKTRACE: full
        run: |
          set -euxo pipefail
          cargo hack --locked test --all-targets \
            --exclude aya-ebpf \
            --exclude aya-ebpf-bindings \
            --exclude aya-log-ebpf \
            --exclude integration-ebpf \
            --exclude integration-test \
            --feature-powerset

      - name: Doctests
        env:
          RUST_BACKTRACE: full
        run: |
          set -euxo pipefail
          cargo hack --locked test --doc \
            --exclude aya-ebpf \
            --exclude aya-ebpf-bindings \
            --exclude aya-log-ebpf \
            --exclude integration-ebpf \
            --exclude integration-test \
            --feature-powerset

  build-test-aya-ebpf:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ fromJSON(needs.prepare.outputs.rust-toolchains).nightly }}
          components: rust-src

      # Installed *after* nightly so it is the default.
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: ${{ fromJSON(needs.prepare.outputs.rust-toolchains).stable }}

      # Cache usage approaches GitHub's default 10 GB repository allowance.
      # Only save default-branch entries, which every branch and PR can
      # restore, so branch- and PR-scoped entries do not evict shared caches.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker,cargo-hack

      - name: Build & test for all BPF architectures
        env:
          RUST_BACKTRACE: full
        run: |
          set -euo pipefail

          failures=()

          # NB: this hand-rolled shell script is used instead of a matrix
          # because the time spent doing useful work per target is about equal
          # to the overhead of setting up the job - so this saves a bunch of
          # machine time.
          for arch in aarch64 arm loongarch64 mips mips64 powerpc64 riscv64 s390x x86_64; do
            echo "::group::arch=$arch"
            export RUSTFLAGS="--cfg bpf_target_arch=\"$arch\""
            for target in bpfeb-unknown-none bpfel-unknown-none; do
              echo "::group::target=$target"
              if ! (
                cargo +nightly hack --locked build \
                  --release \
                  --target "$target" \
                  -Z build-std=core \
                  --package aya-ebpf \
                  --package aya-ebpf-bindings \
                  --package aya-log-ebpf \
                  --package integration-ebpf \
                  --feature-powerset
              ); then
                failures+=("build: $arch/$target")
              fi
              echo "::endgroup::"
            done
            if ! (
              RUSTDOCFLAGS=$RUSTFLAGS cargo +nightly hack --locked test --doc \
                --package aya-ebpf \
                --package aya-ebpf-bindings \
                --package aya-log-ebpf \
                --package integration-ebpf \
                --feature-powerset
            ); then
              failures+=("doctests: $arch")
            fi
            echo "::endgroup::"
          done

          if ((${#failures[@]})); then
            echo "::error::Some builds/tests failed:"
            printf '  %s\n' "${failures[@]}"
            exit 1
          fi

  run-integration-test:
    name: integration VMs (${{ matrix.kernel_line }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        kernel_line: ${{ fromJSON(needs.prepare.outputs.kernel-lines) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/setup-bazel

      - name: Run both guest architectures
        run: |
          set -euxo pipefail
          # Allow enough heap for both per-object kernel graphs.
          bazel --host_jvm_args=-Xmx8g test --config=remote \
            --lockfile_mode=error \
            --remote_download_outputs=toplevel \
            --@rules_rust//rust/toolchain/channel=stable \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --remote_downloader_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            //test/integration-test:vm_aarch64_${{ matrix.kernel_line }} \
            //test/integration-test:vm_x86_64_${{ matrix.kernel_line }}

      - name: Save kernel validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-validation-${{ matrix.kernel_line }}
          path: |
            bazel-out/*/testlogs/test/integration-test/vm_*_${{ matrix.kernel_line }}/

  run-native-integration-test:
    name: native integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/setup-bazel

      - name: Test the host kernel in both Rust modes
        run: |
          set -euxo pipefail
          # Both test actions and host-specific build tools run on this runner;
          # BuildBuddy's anonymous executor is x86_64 only. Keep its cache.
          bazel --host_jvm_args=-Xmx4g test --config=remote \
            --lockfile_mode=error \
            --@rules_rust//rust/toolchain/channel=stable \
            --remote_executor= \
            --extra_execution_platforms=@platforms//host:host \
            --platforms=@platforms//host:host \
            --jobs=4 \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --remote_downloader_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            //test/integration-test:native_fastbuild \
            //test/integration-test:native_opt

  run-macos-integration-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/setup-bazel

      - name: Install host QEMU
        run: brew install qemu

      - name: Boot a source-built VM on macOS
        run: |
          set -euxo pipefail
          bazel --host_jvm_args=-Xmx4g test --config=remote \
            --lockfile_mode=error \
            --@rules_rust//rust/toolchain/channel=stable \
            --platforms=@platforms//host:host \
            --extra_toolchains=@homebrew_qemu//:x86_64 \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --remote_downloader_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            //test/integration-test:vm_x86_64_5_10_macos

  check:
    if: always()
    needs:
      - prepare
      - bazel
      - codegen
      - lint
      - build-test-aya
      - build-test-aya-ebpf
      - run-integration-test
      - run-native-integration-test
      - run-macos-integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(.[]; . == "success")' <<< "$RESULTS"
